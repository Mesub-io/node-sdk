name: CI

# Push only: every branch a pull request is opened from is pushed first, so a
# pull_request trigger ran the same commit a second time.
on:
  push:
    branches: ['**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      # One failing leg does not hide what the others say.
      fail-fast: false
      matrix:
        # Every Node the package says it supports: 20 left with its end of life.
        node: [22, 24]
        express: [5]
        # Express 4 too, the peer range being >=4, once: on the oldest Node.
        include:
          - node: 22
            express: 4
    name: quality (Node ${{ matrix.node }}, Express ${{ matrix.express }})
    steps:
      # Pinned by commit, as every action here: a tag can be moved to point
      # at other code, a commit cannot.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # pnpm 11 itself needs Node 22.13, so installing and building happen on
      # 24 whatever the matrix says. No pnpm version here: the action reads
      # packageManager in package.json, and refuses to run when both name one.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          # It would look for pnpm to set up its cache before pnpm is installed.
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm build

      # Swapped in after the build, for the tests only: the types stay
      # Express 5's, and Nest keeps its own Express 5. Next needs no leg of
      # its own: @mesub/node/next imports nothing from next, only the Web
      # Request and Response every Node here has.
      - if: matrix.express == 4
        run: pnpm add -D express@^4.21.2

      # Then the Node under test, with no pnpm in the way: the tests and the
      # built package are what a merchant on that version runs.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: node --version
      - run: node node_modules/vitest/vitest.mjs run
        if: matrix.node != 24
      # The same run measured once, on the newest Node: v8 coverage of src/,
      # failing under the floor in vitest.config.ts. The report is kept as an
      # artifact (open coverage/index.html) and summed up on the run's page.
      - run: node node_modules/vitest/vitest.mjs run --coverage
        if: matrix.node == 24
      - name: Coverage summary
        if: matrix.node == 24 && !cancelled()
        run: |
          node -e "
            const { total } = require('./coverage/coverage-summary.json');
            const rows = ['statements', 'branches', 'functions', 'lines']
              .map((kind) => '| ' + kind + ' | ' + total[kind].pct + '% | ' + total[kind].covered + ' / ' + total[kind].total + ' |');
            console.log(['### Coverage', '', '| | % | covered |', '| - | - | - |', ...rows].join('\\n'));
          " >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.node == 24 && !cancelled()
        with:
          name: coverage
          path: coverage/
          retention-days: 14
      - run: node scripts/check-exports.mjs
